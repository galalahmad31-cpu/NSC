<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع حسابات التغذية الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2ec4b6;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
        }
        /* تنسيق زر الدخول للحسابات */
        .enter-btn {
            display: inline-block;
            background-color: #2ec4b6;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
            border: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .enter-btn:hover {
            background-color: #011627;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>موقع حسابات التغذية 🍎</h1>
        <p>مرحباً بك في لوحة التحكم الخاصة بك. يمكنك الآن البدء في استخدام أدواتنا المتقدمة لحساب السعرات والماكروز وتصميم الأنظمة الغذائية بدقة علمية.</p>
        
        <!-- الزر يوجه العميل مباشرة للمجلد المحمي والملف المكتوب في الـ vercel.json بدون .html -->
        <a href="/protected/NSC" class="enter-btn">الدخول إلى حاسبة التغذية NSC</a>
    </div>

</body>
</html>
